[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["repo: checks that need a git checkout (skipped otherwise)"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S607", "E501"]
